name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest   # WinUI 3 / Windows App SDK needs a Windows runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # AI-generated (Claude): runs the SecretLead.Core tests; the app project moved to SecretLead.UI/.
      - name: Test
        run: dotnet test SecretLead.Core.Tests/SecretLead.Core.Tests.csproj -c Release

      - name: Restore
        run: dotnet restore SecretLead.UI/SecretLead.UI.csproj -r win-x64 -p:Configuration=Release

      - name: Build
        run: dotnet build SecretLead.UI/SecretLead.UI.csproj -c Release -r win-x64 --no-restore